{% extends 'base.html' %}

{% block title %}로그인 - 의약정보 관리 시스템{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>로그인</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            사용자명 또는 비밀번호가 올바르지 않습니다.
                        </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">사용자명</label>
                        {{ form.username }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">비밀번호</label>
                        {{ form.password }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">로그인</button>
                </form>
            </div>
            <div class="card-footer text-center">
                계정이 없으신가요? <a href="{% url 'accounts:signup' %}">회원가입</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
