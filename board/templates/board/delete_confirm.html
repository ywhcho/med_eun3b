{% extends 'base.html' %}

{% block title %}게시글 삭제 - 게시판{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>게시글 삭제</h3>
    </div>
    <div class="card-body">
        <div class="alert alert-danger">
            <h5>정말 이 게시글을 삭제하시겠습니까?</h5>
            <p class="mb-0">제목: {{ post.title }}</p>
            <p class="mb-0">이 작업은 되돌릴 수 없습니다.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <a href="{% url 'board:detail' post.pk %}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-danger">삭제</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
