{% extends 'base.html' %}

{% block title %}게시글 작성 - 게시판{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>게시글 작성</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-danger">
                    {% for field in form %}
                        {% for error in field.errors %}
                            <p>{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}
            
            <div class="mb-3">
                <label for="{{ form.title.id_for_label }}" class="form-label">{{ form.title.label }}</label>
                {{ form.title }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.content.id_for_label }}" class="form-label">{{ form.content.label }}</label>
                {{ form.content }}
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="{% url 'board:list' %}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary">작성</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
